<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Highway To Hell — Matthew Reid</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      :root {
        --black: #0a0a0a;
        --red: #c8102e;
        --red-dim: #7a0c1e;
        --white: #f5f5f5;
        --gray: #9a9a9a;
        --panel-border: #262626;
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        padding: 0;
        margin: 0;
        background: var(--black);
        color: var(--white);
        font-family: 'Inter', Arial, Helvetica, sans-serif;
        min-height: 100%;
      }

      .game-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 24px;
        border-bottom: 1px solid var(--panel-border);
        background: rgba(10, 10, 10, 0.92);
      }

      .game-bar .back {
        color: var(--gray);
        text-decoration: none;
        font-size: 14px;
        letter-spacing: 0.5px;
        transition: color 0.2s ease;
      }

      .game-bar .back:hover {
        color: var(--red);
      }

      .game-bar .title {
        font-family: 'Oswald', Arial, Helvetica, sans-serif;
        text-transform: uppercase;
        letter-spacing: 2px;
        font-size: 15px;
        color: var(--white);
      }

      .game-stage {
        display: flex;
        justify-content: center;
        padding: 24px;
      }

      .game-stage canvas {
        border: 1px solid var(--panel-border);
        border-radius: 4px;
        box-shadow: 0 0 0 3px rgba(200, 16, 46, 0.12);
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
    <script src="assets/lib/p5.js"></script>
    <script src="assets/lib/p5.dom.js"></script>
    <script src="assets/lib/p5.play.js"></script>
    <script src="assets/lib/p5.sound.js"></script>
    <script src="assets/lib/p5.clickable.js"></script>
    <!-- Firebase (used for the online hi-score leaderboard) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="sketch.js"></script>
  </head>
  <body>
    <div class="game-bar">
      <a class="back" href="../index.html">&larr; Back to portfolio</a>
      <span class="title">Highway To Hell</span>
      <span style="width: 140px;"></span>
    </div>
    <div class="game-stage"></div>
  </body>
</html>
